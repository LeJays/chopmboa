<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="cmg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC20E"/>
      <stop offset="1" stop-color="#FF6B00"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="#0B0B0C"/>
  <!-- speed lines -->
  <rect x="88" y="48" width="16" height="6" rx="3" fill="url(#cmg)"/>
  <rect x="92" y="58" width="18" height="6" rx="3" fill="url(#cmg)"/>
  <rect x="88" y="68" width="13" height="6" rx="3" fill="url(#cmg)"/>
  <!-- chef hat -->
  <g transform="rotate(-10 52 26)">
    <circle cx="44" cy="24" r="9" fill="url(#cmg)"/>
    <circle cx="54" cy="17" r="11" fill="url(#cmg)"/>
    <circle cx="65" cy="23" r="9" fill="url(#cmg)"/>
    <rect x="42" y="24" width="25" height="8" rx="3" fill="url(#cmg)"/>
  </g>
  <!-- C -->
  <path d="M 82.6 76.6A 26 26 0 1 1 82.6 43.4" fill="none" stroke="url(#cmg)" stroke-width="15" stroke-linecap="butt"/>
  <!-- fork -->
  <g stroke="url(#cmg)" stroke-linecap="round" fill="none">
    <path d="M53 46 V 58" stroke-width="4"/>
    <path d="M60 44 V 58" stroke-width="4"/>
    <path d="M67 46 V 58" stroke-width="4"/>
    <path d="M53 56 Q 60 64 67 56" stroke-width="4"/>
    <path d="M60 60 V 80" stroke-width="6"/>
  </g>
</svg>
